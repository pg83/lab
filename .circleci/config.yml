version: 2.1

jobs:
  socks:
    docker:
      - image: python:3.12-bookworm
    resource_class: small
    steps:
      - run:
          name: Install SSH and socat
          command: |
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git openssh-server socat ca-certificates
      - checkout
      - run:
          name: Connect to three labs
          no_output_timeout: 60m
          command: python3 -u .github/s5/runner.py all --port-offset 4 --duration 2400

workflows:
  socks:
    jobs:
      - socks:
          filters:
            branches:
              only: master
